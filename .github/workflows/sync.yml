name: Sync

# Manuell körning av /api/sync. Den schemalagda synken sköts av appen själv
# (instrumentation.ts); ett schema här skulle köra allt dubbelt.
on:
  workflow_dispatch:
    inputs:
      target:
        description: 'Sync target'
        required: true
        default: 'teams'
        type: choice
        options:
          - teams
          - news

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger sync
        run: |
          curl -sf -X POST "${{ vars.RENDER_URL }}/api/sync?target=${{ inputs.target }}" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}"
